<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title description">
  <title id="title">Heed</title>
  <desc id="description">A watchful aperture crossed by a datum with a live signal</desc>
  <style>
    .aperture,
    .datum {
      fill: none;
      stroke: #414559;
      stroke-width: 5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .datum { opacity: .78; }
    .signal {
      fill: #ca9ee6;
    }
    @media (prefers-color-scheme: dark) {
      .aperture,
      .datum {
        stroke: #c6d0f5;
      }
      .signal {
        fill: #ca9ee6;
      }
    }
  </style>
  <circle class="aperture" cx="64" cy="64" r="56" />
  <path class="datum" d="M6 94 122 34" />
  <circle class="signal" cx="91" cy="40" r="14" />
</svg>
